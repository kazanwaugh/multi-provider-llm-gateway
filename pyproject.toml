[project]
name = "multi-provider-llm-gateway"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kazan Waugh", email = "KazanWaugh@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.14.0",
    "fastapi>=0.165.0",
    "openai>=3.59.0",
    "pydantic>=2,<3",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "python-dotenv>=1.2.4",
    "streamlit>=1.67.0",
    "tiktoken>=0.14.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
multi-provider-llm-gateway = "multi_provider_llm_gateway:main"

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
